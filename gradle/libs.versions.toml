# File: gradle/libs.versions.toml
# Purpose: Single source of truth for every dependency and plugin version (Build Spec §4).
# Change a pin only in its own PR; new libraries need the maintainer's approval (AGENTS.md).

[versions]
# Platform baseline (Build Spec §4, D5; compileSdk 37 per ADR-010)
compileSdk = "37"
targetSdk = "36"
minSdk = "31"
jvmTarget = "17"
# NDK for :pdf's JNI library (ADR-011). r28+ links 16 KB-aligned by default (Build Spec §4).
ndk = "28.2.13676358"

# Build tooling
agp = "9.4.0"
kotlin = "2.3.21"
ksp = "2.3.12"
ktlint = "1.8.0"
detekt = "1.23.8"

# Libraries used from P0-01
androidxCore = "1.19.1"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
composeBom = "2026.09.00"
hilt = "2.60.1"
coroutines = "1.11.0"
junit = "4.13.2"
# Instrumented tests on an emulator (P1-02: real PDFium on real PDFs). Test-only, never in the APK.
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"

# Pinned now, first used by later tickets (S3, P1-x). Not resolved until a module depends on them.
media3 = "1.11.1"
room = "2.8.5"
datastore = "1.2.1"
work = "2.12.0"
pdfiumAndroid = "2.0.3"
# sherpa-onnx ships as an AAR on its GitHub releases, not on Maven: resolved from there by an exclusive ivy
# repository (settings.gradle.kts) and checked against this SHA-256 before every build that uses it (ADR-012).
# Bump both together.
sherpaOnnx = "1.13.8"
sherpaOnnxAarSha256 = "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96"
# llama.cpp for the story brain (ADR-078): built from source in :speech's CMake build (arm64 only), from GitHub's
# archive of this release tag, checked against this SHA-256 (LlamaCppSourceTask). Bump both together.
llamaCpp = "b11887"
llamaCppSha256 = "4642d708747f0be2e6af630f016f564618882b58fb92f80585c717a084af4225"
# Tesseract4Android (Phase 3 OCR, ADR-011/ADR-025): Tesseract 5.5.1 + Leptonica, built 16 KB-aligned. Published only on
# JitPack, resolved through an exclusive repository (settings.gradle.kts) and checked against this SHA-256 before
# every :pdf build. Standard (single-threaded) variant. Bump both together.
tesseract4android = "4.9.0"
tesseract4androidAarSha256 = "bce5d6413a1a5ae3d7240033fbbc851ba3217d0a08d9769400e17a077f42cb2a"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# Compose UI tests on the emulator (:app androidTest); versions from the BOM. Test-only, never in the release APK.
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
# :pdf uses the core and api modules of PdfiumAndroidKt directly: the core exposes the native page pointers the
# JNI library needs (ADR-011). Same library and version as the public wrapper, which :pdf does not use.
pdfium-android-core = { module = "io.legere:pdfiumandroid-core", version.ref = "pdfiumAndroid" }
pdfium-android-api = { module = "io.legere:pdfiumandroid-api", version.ref = "pdfiumAndroid" }
sherpa-onnx = { module = "com.k2fsa:sherpa-onnx", version.ref = "sherpaOnnx" }
tesseract4android = { module = "cz.adaptech.tesseract4android:tesseract4android", version.ref = "tesseract4android" }

# Code-quality CLIs, run by the root build (not shipped in the APK)
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }

# Build-logic (convention plugins) compile against these
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
