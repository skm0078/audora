# File: gradle.properties
# Purpose: Build-wide Gradle and Android settings.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Release version (P0-02). The single source of truth: versionCode is derived from it in app/build.gradle.kts,
# and the release workflow refuses to publish a tag that is not "v" + this value. Bump it in the PR that
# prepares a release.
audora.versionName=0.0.1
