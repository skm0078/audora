# File: .github/workflows/baseline-profile.yml
# Purpose: Records the app's Baseline Profile on an Android 14 emulator (ADR 2026-10-30-baseline-profile) and uploads
#          it as the "baseline-prof" artifact, to commit as app/src/main/baseline-prof.txt. Runs by hand (after big
#          changes to start-up, the library or the reader) and on pushes that change the generator itself.

name: Baseline Profile

on:
  workflow_dispatch:
  push:
    paths:
      - "baselineprofile/**"
      - "scripts/ci/baseline_profile.sh"
      - ".github/workflows/baseline-profile.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    name: Record the Baseline Profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Android 13+ lets the shell read an app's profile without root; ATD images boot fastest.
      EMULATOR_IMAGE: "system-images;android-34;aosp_atd;x86_64"

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and the generator
        run: ./gradlew :app:assembleBenchmark :baselineprofile:assembleBenchmark --stacktrace

      - name: Start the emulator
        timeout-minutes: 15
        run: scripts/ci/start_emulator.sh

      - name: Record
        timeout-minutes: 30
        run: |
          scripts/ci/baseline_profile.sh | tee record.txt
          { echo "### Baseline Profile"; tail -n 3 record.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the profile
        uses: actions/upload-artifact@v5
        with:
          name: baseline-prof
          path: app/src/main/baseline-prof.txt
          if-no-files-found: error
          retention-days: 30

      - name: Generator log on failure
        if: failure()
        run: |
          timeout 30 "$ANDROID_HOME/platform-tools/adb" logcat -d -s TestRunner:I Benchmark:I AndroidRuntime:E || true
          find baselineprofile/build/outputs -name '*.xml' -path '*androidTest-results*' -exec cat {} + | head -c 20000

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: baseline-profile-reports-${{ github.run_id }}
          path: |
            baselineprofile/build/reports/androidTests/
            baselineprofile/build/outputs/
            emulator.log
          if-no-files-found: ignore
          retention-days: 14
