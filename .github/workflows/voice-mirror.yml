# File: .github/workflows/voice-mirror.yml
# Purpose: Publishes the downloadable voices, models and dictionaries of speech/models.json to the "voices" release
#          (P4-01, ADR-022; the dictionaries, ADR-045, ADR-047).
#
# scripts/build_voice_mirror.py rebuilds each zip from its SHA-pinned upstream archive and fails unless the bytes
# match the catalog's pin, so what lands on the release is exactly what the app checks for. Assets are only ever
# added, never replaced or deleted: an APK in someone's hands keeps working after the catalog moves on.
# On feature branches it only builds and checks; publishing happens from dev.

name: Voice mirror

on:
  push:
    paths:
      - speech/models.json
      - scripts/build_voice_mirror.py
      - scripts/build_dictionary.py
      - speech/licences/**
      - .github/workflows/voice-mirror.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voice-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Build, check and publish voices
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The pins were computed with 3.13; zipfile's stored output is stable, but there is no reason to vary it.
          python-version: "3.13"

      - name: Test the mirror scripts
        run: python3 -m unittest scripts/tests/test_build_voice_mirror.py scripts/tests/test_build_dictionary.py -v

      - name: Build and check every voice against its pin
        run: python3 scripts/build_voice_mirror.py --out dist

      - name: Build and check the dictionaries against their pins
        # A dictionary already on the release is kept as published: Wiktionary snapshots are replaced upstream.
        run: >-
          python3 scripts/build_dictionary.py --out dist
          --published "https://github.com/${{ github.repository }}/releases/download/voices/"

      - name: Publish new assets to the voices release
        if: github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: voices
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Downloadable voices" \
              --notes "Voice models Audora downloads from Settings → Voices (speech/models.json). Each zip is rebuilt from its pinned sherpa-onnx archive by scripts/build_voice_mirror.py; licences are listed per voice in the app. Assets are never replaced."
          fi
          existing=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for zip in dist/*.zip; do
            name=$(basename "$zip")
            if grep -qxF "$name" <<< "$existing"; then
              echo "$name already published"
            else
              gh release upload "$TAG" "$zip"
              echo "Published $name"
            fi
          done
