# File: .github/workflows/android.yml
# Purpose: On every push and PR: style, static analysis, unit tests, golden corpus and listening scores, debug APKs, 16 KB
#          alignment check, APK size budget.
#          The debug APKs (Audora, the S3 playback spike and the S1 voices spike) are uploaded as one artifact
#          (Build Spec §7).
#          A second job runs the instrumented tests (real PDFium on real PDFs, P1-02) on an x86_64 emulator.
#          It also builds the unsigned release APK, so a release-only failure (lint-vital, release config) shows up here
#          and not first on release day. Signed releases: release.yml.

name: Android CI

# Every branch push runs CI, so a PR from a branch in this repo shows the result without a second run.
# Tags are left to release.yml.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check, test, assemble
    runs-on: ubuntu-latest
    # R8 runs for the release and dev APKs (ADR-072).
    timeout-minutes: 40
    outputs:
      apk-name: ${{ steps.apk.outputs.name }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Shared hotspot files untouched (parallel PRs merge cleanly)
        # Fails in seconds a branch that edits a file every PR used to conflict on, and says what to do instead
        # (AGENTS.md, Parallel PRs). Needs the branch's history back to where it left dev.
        if: github.ref_name != 'dev' && github.ref_name != 'prod'
        run: |
          dev="+refs/heads/dev:refs/remotes/origin/dev"
          git fetch --no-tags --unshallow origin "$dev" || git fetch --no-tags origin "$dev"
          python3 scripts/check_hotspots.py --base origin/dev

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source (MIT) cache provider; the default "enhanced" provider is proprietary.
          cache-provider: basic
          # Only the long-lived branches write the cache; feature branches read it.
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/prod' }}

      - name: Stable debug signing key (optional)
        # Without a fixed key every run signs with a fresh debug key, so a newer dev build cannot install over an
        # older one (ADR-031). When the secret holds the dev key, AGP uses it as its default debug keystore
        # (store and key password "android", alias androiddebugkey: not secret for a debug key). Without the secret,
        # or on a fork, nothing changes: AGP creates a throwaway key as before.
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.AUDORA_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "No AUDORA_DEBUG_KEYSTORE_B64 secret: debug APKs use a throwaway key for this run."
            exit 0
          fi
          keystore_dir="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$keystore_dir"
          keystore="$keystore_dir/debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > "$keystore"
          # Fails here, with a clear message, if the secret is not a keystore AGP can open.
          if ! keytool -exportcert -keystore "$keystore" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/dev-key.der"; then
            echo "::error::AUDORA_DEBUG_KEYSTORE_B64 is not a keystore with alias androiddebugkey and password android (docs/RELEASING.md)."
            exit 1
          fi
          cert_sha256="$(sha256sum "$RUNNER_TEMP/dev-key.der" | cut -d' ' -f1)"
          echo "Dev key certificate: $cert_sha256"
          echo "EXPECTED_DEBUG_CERT_SHA256=$cert_sha256" >> "$GITHUB_ENV"

      - name: Test the repo scripts (16 KB checker, voice mirror, hotspot check)
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Golden corpus page dumps are current
        # The JVM golden test reads PDFium page dumps (P2-01, pdf/golden/README.md). Re-dump every golden page with
        # the pinned desktop PDFium and the production page reader, and fail if a golden PDF or page_reader.cpp
        # changed without new dumps. Keep the pypdfium2 version in step with scripts/pdf/golden_corpus.py.
        run: |
          python3 -m venv "$RUNNER_TEMP/golden-venv"
          "$RUNNER_TEMP/golden-venv/bin/pip" install --quiet pypdfium2==5.13.0
          "$RUNNER_TEMP/golden-venv/bin/python" scripts/pdf/golden_corpus.py dump --check

      - name: Fetch the base branch's golden scores
        # The golden gate compares with dev's scores, so a branch cannot lower the bar by editing its own
        # scores.tsv. An empty file (dev has no scores yet) skips the gate.
        run: |
          baseline="$RUNNER_TEMP/golden-baseline.tsv"
          git fetch --no-tags --depth=1 origin dev
          git show FETCH_HEAD:pdf/golden/scores.tsv > "$baseline" 2>/dev/null || : > "$baseline"
          echo "GOLDEN_BASELINE=$baseline" >> "$GITHUB_ENV"
          # The listening score (RI-8a) is gated the same way; dev has no listening scores until RI-8a merges.
          listening="$RUNNER_TEMP/listening-baseline.tsv"
          git show FETCH_HEAD:pdf/golden/listening/scores.tsv > "$listening" 2>/dev/null || : > "$listening"
          echo "LISTENING_BASELINE=$listening" >> "$GITHUB_ENV"

      - name: ktlint, detekt, unit tests, golden and listening scores, debug APKs, unsigned release APK and bundle, lint
        # assembleDebugAndroidTest only compiles the instrumented tests; the device-tests job runs them.
        # :pdf:goldenTest rewrites docs/QUALITY.md and pdf/golden/scores.tsv, :playback:listeningTest docs/LISTENING.md
        # and pdf/golden/listening/scores.tsv; the next step checks they were committed.
        run: >-
          ./gradlew ktlintCheck detekt test :pdf:goldenTest -Pgolden.baseline="$GOLDEN_BASELINE"
          :playback:listeningTest -Plistening.baseline="$LISTENING_BASELINE"
          assembleDebug :app:assembleDev :app:assembleRelease :app:bundleRelease :app:lintDebug
          :pdf:assembleDebugAndroidTest :playback:assembleDebugAndroidTest :speech:assembleDebugAndroidTest
          :app:assembleUiTestAndroidTest --stacktrace

      - name: Lint report
        # Android lint over the app and every module it depends on (API levels above minSdk among them).
        if: failure()
        run: cat app/build/reports/lint-results.txt 2>/dev/null || echo "No lint report (lint did not run)."

      - name: Golden scores are committed
        # docs/QUALITY.md and scores.tsv depend only on the code and the corpus, so a difference means the commit
        # changed the pipeline's output without recording its score.
        run: |
          changes="$(git status --porcelain -- docs/QUALITY.md pdf/golden/scores.tsv)"
          if [ -n "$changes" ]; then
            echo "::error::Golden scores changed. Run ./gradlew :pdf:goldenTest and commit docs/QUALITY.md and pdf/golden/scores.tsv."
            git --no-pager diff -- docs/QUALITY.md pdf/golden/scores.tsv
            exit 1
          fi

      - name: Listening scores are committed
        # Same rule for the listening score (RI-8a): what the voice is given changed without recording its score.
        run: |
          changes="$(git status --porcelain -- docs/LISTENING.md pdf/golden/listening/scores.tsv)"
          if [ -n "$changes" ]; then
            echo "::error::Listening scores changed. Run ./gradlew :playback:listeningTest and commit docs/LISTENING.md and pdf/golden/listening/scores.tsv."
            git --no-pager diff -- docs/LISTENING.md pdf/golden/listening/scores.tsv
            exit 1
          fi

      - name: 16 KB alignment check
        run: |
          python3 scripts/check_16kb_alignment.py \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/dev/*.apk \
            app/build/outputs/apk/release/*.apk \
            spikes/playback/build/outputs/apk/debug/*.apk \
            spikes/voices/build/outputs/apk/debug/*.apk

      - name: APK size budget
        # Fails an APK over scripts/perf/apk-budget.json and shows each APK's size, and the dev APK's change from the
        # published dev build, on the run's summary page (ADR 2026-10-28-performance-budget). The baseline is best
        # effort: without network or the release the change shows as n/a and nothing fails.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          baseline="$(gh release view dev-build --json assets \
            --jq '.assets[] | select(.name == "audora-dev.apk") | .size' 2> /dev/null || true)"
          budget=scripts/perf/apk-budget.json
          status=0
          {
            echo "### APK size"
            echo
            python3 scripts/perf/check_apk_size.py --header --budget "$budget" --variant dev \
              --baseline-bytes "${baseline:-0}" app/build/outputs/apk/dev/*.apk || status=1
            python3 scripts/perf/check_apk_size.py --budget "$budget" --variant release \
              app/build/outputs/apk/release/*.apk || status=1
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Library load numbers
        # The JVM load test (LibraryLoadTest) writes its timings at 1,000 and 5,000 books; shown even when it failed.
        if: always()
        run: cat app/build/load-test/library-load.md >> "$GITHUB_STEP_SUMMARY" 2> /dev/null || echo "No load numbers"

      - name: Debug signing certificate
        # Logs the debug APK's certificate. With the dev key installed it must be that key's, so a build that fell
        # back to a throwaway key fails here instead of publishing a dev build that cannot update the previous one.
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          # The dev APK (ADR-072) is what the phones install, so it must carry the same key.
          for dir in debug dev; do
            apk="$(find "app/build/outputs/apk/$dir" -name '*.apk' | head -n 1)"
            certs="$("$build_tools/apksigner" verify --print-certs "$apk" \
              | grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}' | sort -u)"
            echo "$dir APK signing certificate: ${certs:-none}"
            if [ -n "${EXPECTED_DEBUG_CERT_SHA256:-}" ] && [ "$certs" != "$EXPECTED_DEBUG_CERT_SHA256" ]; then
              echo "::error::$dir APK signed with ${certs:-no certificate}, not with the dev key $EXPECTED_DEBUG_CERT_SHA256 (docs/RELEASING.md)."
              exit 1
            fi
          done

      - name: Name the debug APKs
        id: apk
        run: |
          short_sha="${GITHUB_SHA::7}"
          name="audora-debug-${short_sha}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/${name}.apk"
          cp app/build/outputs/apk/dev/*.apk "dist/audora-dev-${short_sha}.apk"
          cp spikes/playback/build/outputs/apk/debug/*.apk "dist/audora-s3-spike-${short_sha}.apk"
          cp spikes/voices/build/outputs/apk/debug/*.apk "dist/audora-s1-voices-${short_sha}.apk"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Upload debug APKs
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Room schemas are committed
        # The build exports every database schema version to */schemas/ (P1-01). A schema the build changed or
        # added but nobody committed would leave a later migration nothing to migrate from, so fail and print it.
        run: |
          changes="$(git status --porcelain --untracked-files=all -- ':(glob)**/schemas/**')"
          if [ -n "$changes" ]; then
            echo "::error::Room schema files changed by the build are not committed. Commit these:"
            echo "$changes"
            echo "$changes" | cut -c4- | while read -r path; do
              echo "----- $path"
              cat "$path"
            done
            exit 1
          fi

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: reports-${{ github.run_id }}
          path: |
            build/reports/
            */build/reports/
            pdf/build/golden/
            playback/build/listening/
          if-no-files-found: ignore
          retention-days: 14

  # Instrumented tests need a real Android runtime: PDFium and our JNI library are native code. The emulator is
  # x86_64 because GitHub's Linux runners are x86_64 with KVM; :pdf builds that ABI for tests only.
  device-tests:
    name: Device tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EMULATOR_IMAGE: "system-images;android-34;aosp_atd;x86_64"

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/prod' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the test APK
        # The uiTest and benchmark APKs are the debug and dev builds for x86_64, timed after the tests (ADR-072).
        run: >-
          ./gradlew :pdf:assembleDebugAndroidTest :playback:assembleDebugAndroidTest :speech:assembleDebugAndroidTest
          :app:assembleUiTestAndroidTest :app:assembleUiTest :app:assembleBenchmark --stacktrace

      - name: Start the emulator
        timeout-minutes: 15
        run: scripts/ci/start_emulator.sh

      # :app includes the release journey (app/src/androidTest/.../release): the real app, end to end, on this fresh
      # install. Its OCR step downloads the text recognition files from GitHub, as a phone would.
      - name: Instrumented tests (:pdf, :playback, :speech, :app)
        timeout-minutes: 30
        run: >-
          ./gradlew :pdf:connectedDebugAndroidTest :playback:connectedDebugAndroidTest
          :speech:connectedDebugAndroidTest :app:connectedUiTestAndroidTest --stacktrace

      # Debug build against the dev build (ADR-072): cold start, frames and memory on this emulator. Emulator numbers
      # are not phone numbers; the ratio between the two builds is what to read. Never fails the job.
      - name: Speed numbers (debug vs dev build)
        if: always()
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export ADB="$ANDROID_HOME/platform-tools/adb"
          debug_apk="$(find app/build/outputs/apk/uiTest -name '*.apk' | head -n 1)"
          dev_apk="$(find app/build/outputs/apk/benchmark -name '*.apk' | head -n 1)"
          scripts/perf/time_builds.sh \
            "debug=$debug_apk" \
            "dev=$dev_apk" | tee speed.txt
          { echo "### Speed numbers (emulator, debug vs dev build)"; sed -n '/^| Build/,$p' speed.txt; } >> "$GITHUB_STEP_SUMMARY"

      # UI changes ship with emulator screenshots (PlayerLayoutTest saves them to Downloads, which outlives the
      # test app's uninstall). Download the "player-screens" artifact from the run's summary page to look at them.
      - name: Pull the screenshots
        if: always()
        run: |
          mkdir -p screens
          timeout 60 "$ANDROID_HOME/platform-tools/adb" pull /sdcard/Download/ListenLock-screens/. screens/ \
            || echo "No screenshots on the emulator (the :app device tests did not run)"
          ls -l screens

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: player-screens-${{ github.run_id }}
          path: screens/
          if-no-files-found: ignore
          retention-days: 14

      - name: Failed device tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob("*/build/outputs/androidTest-results/connected/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  print(f"ran {case.get('classname')}.{case.get('name')} in {case.get('time')} s")
                  for problem in list(case.findall("failure")) + list(case.findall("error")):
                      print(f"::error::{case.get('classname')}.{case.get('name')}")
                      print(f"message: {problem.get('message') or ''}"[:1000])
                      print((problem.text or "").strip()[:3000])
          PY

      - name: Memory test numbers
        if: always()
        run: 'timeout 30 "$ANDROID_HOME/platform-tools/adb" logcat -d -s AudoraMemoryTest:I AudoraSpeechTest:I AudoraPlaybackTest:I TesseractOcrTest:I ReleaseJourney:I AudoraLoadTest:I Audora.Playback.Service:I ExoPlayerImpl:W DefaultAudioSink:W AudioTrack:W AndroidRuntime:E DEBUG:F libc:F sherpa-onnx:W TestRunner:I || true'

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: device-test-reports-${{ github.run_id }}
          path: |
            */build/reports/androidTests/
            */build/outputs/androidTest-results/
            emulator.log
          if-no-files-found: ignore
          retention-days: 14

  # Rolling "dev build" pre-release: a fixed download link that opens on a phone without a GitHub login.
  # Runs only for the dev branch, in its own job so only this job gets write access.
  publish-dev-build:
    name: Publish dev build
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-dev-build
      cancel-in-progress: false

    steps:
      - name: Download debug APKs
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.build.outputs.apk-name }}
          path: dist

      - name: Replace the dev-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: dev-build
        run: |
          # audora-dev.apk is the optimised dev build (ADR-072). The debug build stays beside it under a name
          # Obtainium's "audora-dev" filter does not match: same app id and key, so it installs over the dev build if
          # R8 ever breaks something, and logs show whether a slowness is the build's or the code's.
          cp dist/audora-dev-*.apk audora-dev.apk
          cp dist/audora-debug-*.apk listenlock-debug.apk
          cp dist/audora-s3-spike-*.apk audora-s3-spike.apk
          cp dist/audora-s1-voices-*.apk audora-s1-voices.apk
          gh release delete "$TAG" --cleanup-tag --yes || echo "No previous $TAG release"
          gh release create "$TAG" audora-dev.apk listenlock-debug.apk audora-s3-spike.apk audora-s1-voices.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Dev build (${GITHUB_SHA::7})" \
            --notes "Latest builds of the dev branch, commit ${GITHUB_SHA}: audora-dev.apk (the app, optimised like release), listenlock-debug.apk (the same app as a debug build, a fallback), audora-s3-spike.apk (S3 background-playback test) and audora-s1-voices.apk (S1 voice benchmark). For testing only; not signed for release."
