# File: .github/workflows/ui-tour.yml
# Purpose: The UI tour (UiTourTest): screenshots of every main screen of the real app in English, Hindi and Bengali at
#          font sizes 1, 1.3 and 2, plus dark mode, for UI reviews. Runs on feat/ui-* pushes and by hand. The pictures
#          go to the run's "ui-tour" artifact and, so a review can fetch them with plain git, to the ui-tour-screens
#          branch (one commit, replaced each run). On a pull request that changes the app's screens or strings it
#          tours only font size 2 and fails on a word broken across lines (a squeezed row), without publishing.

name: UI tour

on:
  push:
    branches: ["feat/ui-*"]
  pull_request:
    paths:
      - "app/src/main/kotlin/io/github/skm0078/audora/ui/**"
      - "app/src/main/res/values*/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tour:
    name: UI tour (emulator)
    # A feat/ui-* branch already gets the full tour on push.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'feat/ui-')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Google APIs, not ATD: the full system fonts, as on a phone, so Hindi and Bengali render as listeners see them.
      EMULATOR_IMAGE: "system-images;android-34;google_apis;x86_64"

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the test APK
        run: ./gradlew :app:assembleUiTest :app:assembleUiTestAndroidTest --stacktrace

      - name: Start the emulator
        timeout-minutes: 15
        run: |
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          adb="$ANDROID_HOME/platform-tools/adb"
          emulator="$ANDROID_HOME/emulator/emulator"
          fail() {
            echo "::error::$1"
            tail -n 80 emulator.log 2> /dev/null || true
            exit 1
          }
          yes | "$tools/sdkmanager" --licenses > /dev/null || true
          "$tools/sdkmanager" --install emulator platform-tools "$EMULATOR_IMAGE" > /dev/null
          # Pin where the AVD lives: the runner's older avdmanager and the new emulator disagree on the default.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$tools/avdmanager" create avd --force --name ci --package "$EMULATOR_IMAGE"
          # A common 6.7-inch phone: 1080 x 2400 px at 420 dpi (411 x 914 dp), so layouts match what listeners see.
          printf 'hw.lcd.width=1080\nhw.lcd.height=2400\nhw.lcd.density=420\n' >> "$ANDROID_AVD_HOME/ci.avd/config.ini"
          if ! "$emulator" -list-avds | grep -qx ci; then
            find "$HOME" "$RUNNER_TEMP" -name 'ci.ini' 2> /dev/null || true
            fail "AVD 'ci' was not created in $ANDROID_AVD_HOME"
          fi
          "$emulator" -accel-check || true
          "$adb" start-server
          nohup "$emulator" -avd ci -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none -memory 4096 > emulator.log 2>&1 &
          emulator_pid=$!
          booted=""
          for _ in $(seq 1 120); do
            kill -0 "$emulator_pid" 2> /dev/null || fail "Emulator exited before booting"
            booted="$(timeout 10 "$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r' || true)"
            [ "$booted" = "1" ] && break
            sleep 5
          done
          [ "$booted" = "1" ] || fail "Emulator did not finish booting"
          echo "Emulator booted"

      - name: Tour the app
        timeout-minutes: 30
        env:
          EVENT: ${{ github.event_name }}
        run: |
          args="-Pandroid.testInstrumentationRunnerArguments"
          scales=""
          [ "$EVENT" = "pull_request" ] && scales="$args.uiTourScales=2.0"
          ./gradlew :app:connectedUiTestAndroidTest "$args.class=io.github.skm0078.audora.ui.tour.UiTourTest" \
            "$args.uiTour=true" $scales --stacktrace

      - name: Pull the screenshots
        if: always()
        run: |
          mkdir -p tour
          timeout 120 "$ANDROID_HOME/platform-tools/adb" pull /sdcard/Download/ListenLock-screens/tour/. tour/ \
            || echo "No tour screenshots on the emulator"
          ls tour | head -400
          echo "$(ls tour | wc -l) screenshots"

      - name: Tour log
        if: always()
        run: 'timeout 30 "$ANDROID_HOME/platform-tools/adb" logcat -d -s UiTour:I UiTour:W AndroidRuntime:E || true'

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-tour-${{ github.run_id }}
          path: tour/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish the screenshots to the ui-tour-screens branch
        if: always() && github.event_name != 'pull_request'
        env:
          TOKEN: ${{ github.token }}
        run: |
          [ -n "$(ls -A tour 2> /dev/null)" ] || { echo "Nothing to publish"; exit 0; }
          cd tour
          git init -q -b ui-tour-screens
          printf 'Screens from %s at %s (run %s)\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" > SOURCE.txt
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "UI tour of $GITHUB_REF_NAME at ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ui-tour-screens
