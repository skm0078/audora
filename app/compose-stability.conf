// File: app/compose-stability.conf
// Purpose: Types from the plain-Kotlin modules that Compose may treat as stable (ADR 2026-10-29-speed-quick-wins).
//
// :core is compiled without the Compose compiler, so Compose cannot see that these never change after they are made
// and redraws every library row whenever the list is published again (a file check, a reading position, a shelf).
// Listed here, an unchanged book compares equal and its row is skipped. Add a type only when every property is a val
// of an immutable type, all the way down: a type listed here that changes in place would show stale values.
io.github.skm0078.audora.core.library.Book
io.github.skm0078.audora.core.library.BookId
io.github.skm0078.audora.core.library.BookProgress
